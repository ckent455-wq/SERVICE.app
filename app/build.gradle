plugins { id 'com.android.application' }
android {
    namespace 'com.restaurantrelay'
    compileSdk 35
    defaultConfig { applicationId 'com.restaurantrelay'; minSdk 26; targetSdk 35; versionCode 8; versionName '1.0.3' }
    signingConfigs {
        release {
            if (System.getenv('SERVICE_SIGNING_STORE')) {
                storeFile file(System.getenv('SERVICE_SIGNING_STORE'))
                storePassword System.getenv('SERVICE_SIGNING_PASSWORD')
                keyAlias 'service-release'
                keyPassword System.getenv('SERVICE_SIGNING_PASSWORD')
            }
        }
    }
    buildTypes {
        release { signingConfig signingConfigs.release; minifyEnabled false }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { testImplementation 'junit:junit:4.13.2' }
